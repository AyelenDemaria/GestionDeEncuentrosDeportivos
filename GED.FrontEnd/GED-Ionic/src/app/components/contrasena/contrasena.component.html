<div class="ion-page" id="main-content">

  <ion-header [translucent]="true">
    <ion-toolbar color="light">
      <ion-title  style="font-family: 'Segoe UI';" >Cambiar contraseña</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content color="light" class="justify-content-center">
    <ion-card class="card-for-login">
      <ion-card-content>
        <form [formGroup]="form">
          <ion-item lines="full">
            <ion-label  style="font-family: 'Segoe UI'" position="floating">Contraseña nueva</ion-label>
            <ion-input type="text" formControlName="psw1"></ion-input>
          </ion-item>
          <div class="alert alert-danger" *ngIf="psw1.invalid && (psw1.dirty || psw1.touched)">
            <div class="container-error-message" *ngIf="psw1.errors.required">
              Este campo es obligatorio.
            </div>
          </div>
          <ion-item lines="full">
            <ion-label  style="font-family: 'Segoe UI'" position="floating">Repetir contraseña</ion-label>
            <ion-input required type="text" formControlName="psw2"></ion-input>
          </ion-item>
          <div class="alert alert-danger" *ngIf="psw2.invalid && (psw2.dirty || psw2.touched)">
            <div class="container-error-message" *ngIf="psw2.errors.required">
              Este campo es obligatorio.
            </div>
            <div class="container-error-message" *ngIf="psw2.errors.minlength">
              La contraseña debe tener como mínimo 6 caracteres.
            </div>
            <div class="container-error-message" *ngIf="psw2.errors.maxlength">
              La contraseña debe tener como máximo 15 caracteres.
            </div>
          </div>
          <ion-list>
            <div style="display: grid; justify-content:center ;">
                <!-- <ion-button (click)="cambiarContrasena()" type="submit" class="boton" color="success" expand="full"
                  [disabled]="!form.valid" strong>Cambiar</ion-button> -->
                <button (click)="cambiarContrasena()" class="boton" [disabled]="!form.valid"
                  [ngClass]="{'btn-disabled': !form.valid, 'btn-enabled': form.valid}">
                  Cambiar
                </button>          
              <!-- <ion-button type="submit" class="boton" color="success" expand="full" strong
                (click)="cancel()">Cancelar</ion-button> -->         
            <button class="btn-enabled" (click)="cancel()">Cancelar</button>
            </div>
          </ion-list>
        </form>
      </ion-card-content>
    </ion-card>
  </ion-content>
