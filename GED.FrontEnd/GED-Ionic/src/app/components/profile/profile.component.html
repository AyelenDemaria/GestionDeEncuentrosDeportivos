<div class="ion-page" id="main-content">

    <ion-header [translucent]="true">
        <ion-toolbar color="light">
            <ion-buttons slot="end">
                <ion-menu-button></ion-menu-button>
            </ion-buttons>
            <ion-buttons slot="start" style="margin-left: 1rem;  font-size: x-large;" [routerLink]="['/home']">
                <ion-icon name="home-outline"></ion-icon>
            </ion-buttons>
            <ion-title style="font-family: 'Segoe UI';">Mi perfil</ion-title>
        </ion-toolbar>
    </ion-header>

    <ion-content class="ion-padding">

        <div class="container col-md-12 text-center">
            <div style="display: flex;">
                <ion-card-title style="text-align:center; ">{{perfil?.user.first_name}}</ion-card-title>
                <ion-card-title style="text-align:center; ">{{perfil?.user.last_name}}</ion-card-title>
            </div>
            <ion-card>

                <ion-card-header style="color:rgb(39, 2, 48)">

                </ion-card-header>
                <ion-card-content>
                    <ion-list>
                        <ion-item>
                            <ion-icon name="person-circle" class="fig"></ion-icon>
                            <ion-title>{{perfil?.user.username}}</ion-title>
                        </ion-item>


                        <!-- <ion-item>
                <ion-icon name="call" class="icon"></ion-icon>
                <ion-title>{{perfil.telefono}}</ion-title>
              </ion-item>
              <div *ngIf="mostrarInput" class="ion-padding">
                <ion-item>
                  <ion-label position="floating">Nuevo teléfono</ion-label>
                  <ion-input [(ngModel)]="nuevoTelefono" type="tel"></ion-input>
                </ion-item>
                <ion-button class="boton" color="success" expand="full" (click)="actualizarTelefono()">
                  <strong>Guardar cambios</strong>
                </ion-button>
              </div> -->

                        <ion-item>
                            <ion-icon name="call" class="fig"></ion-icon>
                            <ng-container *ngIf="!mostrarInput; else inputTemplate">
                                <ion-title style="padding: 0; margin-left: 1rem;">
                                    {{perfil?.telefono}}</ion-title>
                            </ng-container>
                            <ng-template #inputTemplate>
                                <ion-input [(ngModel)]="nuevoTelefono" type="tel"></ion-input>
                            </ng-template>
                            <div *ngIf="!mostrarInput">
                                <button size="small" slot="end" class="edit" (click)="mostrarInputTelefono()">
                                    Editar
                                </button>
                            </div>
                            <div *ngIf="mostrarInput" style="display: flex;  padding-right: 0;">
                                <button size="small" slot="end" class="ok" (click)="actualizarTelefono()">
                                    <ion-icon slot="icon-only" name="checkmark-sharp"></ion-icon>
                                </button>
                                <button size="small" slot="end" class="no" (click)="cancelar()">
                                    <ion-icon slot="icon-only" name="close-sharp"></ion-icon>
                                </button>
                            </div>
                            <!-- <ion-button size="small" slot="end" (click)="mostrarInputTelefono()">
                                Editar
                            </ion-button> -->
                        </ion-item>
                        <!-- <div *ngIf="mostrarInput" class="ion-padding">
                            <ion-button size="small" slot="end"(click)="actualizarTelefono()">
                                <strong>Guardar cambios</strong>
                            </ion-button>
                            <ion-button size="small" slot="end"(click)="cancelar()">
                                <strong>Cancelar</strong>
                            </ion-button>
                        </div> -->

                        <ion-item>
                            <ion-icon name="male-female-sharp" class="fig"></ion-icon>
                            <ion-title>{{perfil?.sexo}}</ion-title>
                        </ion-item>

                        <ion-item>
                            <ion-icon name="calendar" class="fig"></ion-icon>

                            <ion-title>{{perfil?.fecha_nacimiento}}</ion-title>
                        </ion-item>

                        <ion-item>
                            <ion-icon name="id-card-sharp" class="fig"></ion-icon>
                            <ion-title type="pass">{{perfil?.documento}}</ion-title>
                        </ion-item>
                    </ion-list>
                </ion-card-content>
            </ion-card>
            <div style="display: grid; justify-content:center ;">
                <button class="btn" (click)="contrasena()">
                    Cambiar contraseña
                </button>
            </div>

        </div>
    </ion-content>
</div>
