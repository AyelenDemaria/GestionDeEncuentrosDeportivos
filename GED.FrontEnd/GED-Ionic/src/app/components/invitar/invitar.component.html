<div class="ion-page" id="main-content">

    <ion-header [translucent]="true">
        <ion-toolbar color="light">
            <ion-buttons slot="end">
                <ion-menu-button></ion-menu-button>
            </ion-buttons>
            <ion-buttons slot="start" style="margin-left: 1rem;  font-size: x-large;" [routerLink]="['/home']">
                <ion-icon name="home-outline"></ion-icon>
            </ion-buttons>
            <ion-title  style="font-family: 'Segoe UI';" >Invitar jugadores</ion-title>
        </ion-toolbar>
    </ion-header>
    <ion-content>

        <ion-searchbar placeholder="Ingrese nombre o DNI" [(ngModel)]="filtro"></ion-searchbar>

        <div class="content boton">
            <div *ngFor="let jug of filteredJugadores">

                <ion-card>
                    <ion-card-header style="padding-bottom: 0;">
                        <div style="display: flex; justify-content: space-between;">
                            <ion-card-title>{{jug.user.first_name}} {{jug.user.last_name}}</ion-card-title>
                            <ion-buttons style="font-size: x-large;" (click)="mensajeConfirmacion(jug.user.id)">
                                <ion-icon class="yes" name="person-add"></ion-icon>
                            </ion-buttons>
                        </div>
                        <ion-card-subtitle>DNI: {{jug.documento}}</ion-card-subtitle>
                    </ion-card-header>
                    <ion-card-content>
                        <ion-list>
                            <ion-item>
                                <ion-text>Sexo:</ion-text> {{jug.sexo}}
                            </ion-item>
                            <ion-item>
                                <ion-text>Usuario:</ion-text> {{jug.user.username}}
                            </ion-item>
                            <ion-item>
                                <ion-text>Celular:</ion-text> {{jug.telefono}}
                            </ion-item>
                            <ion-item>
                                <ion-text>Fecha de nacimiento:</ion-text> {{jug.fecha_nacimiento}}
                            </ion-item>
                        </ion-list>
                    </ion-card-content>
                </ion-card>
            </div>
        </div>
    </ion-content>
