<div class="ion-page" id="main-content">
    <ion-header [translucent]="true">
        <ion-toolbar color="light">
            <ion-buttons slot="end">
                <ion-menu-button></ion-menu-button>
            </ion-buttons>
            <ion-buttons slot="start" style="margin-left: 1rem;  font-size: x-large;" [routerLink]="['/home']">
                <ion-icon name="home-outline"></ion-icon>
            </ion-buttons>
            <ion-title  style="font-family: 'Segoe UI';" >Mis voucher</ion-title>
        </ion-toolbar>
    </ion-header>

    <ion-content [fullscreen]="true" class="text-center">

        <div class="content boton">
            <div *ngFor="let voucher of vouchers$ | async">
                <ion-card>
                    <ion-card-header style="padding-bottom: 0;">
                        <div *ngIf="estadoUsar(voucher.fecha_canje, voucher.fecha_vencimiento)" style="justify-content: end; display: flex;">
                            <button class="button1" (click)="usarVoucher(voucher.id)">USAR</button>
                        </div>
                        <div *ngIf="voucher.fecha_canje !== null" style="justify-content: end; display: flex;">
                            <button class="button2">USADO</button>
                        </div>
                        <div *ngIf="estadoVencido(voucher.fecha_canje, voucher.fecha_vencimiento)" style="justify-content: end; display: flex;">
                            <button class="button3">VENCIDO</button>
                        </div>
                        <ion-card-title style="margin-top: 0rem;">{{voucher.cancha.nombre}}</ion-card-title>
                        <ion-card-subtitle>{{voucher.cancha.deporte.descripcion}}</ion-card-subtitle>
                    </ion-card-header>
                    <ion-card-content>
                        <ion-list>
                            <ion-item>
                                <ion-text>Dirección:</ion-text> {{voucher.cancha.direccion}}
                            </ion-item>
                            <ion-item>
                                <ion-text>Fecha emisión:</ion-text> {{voucher.fecha_emision}}
                            </ion-item>
                            <ion-item>
                                <ion-text>Fecha vencimiento:</ion-text> {{voucher.fecha_vencimiento}}
                            </ion-item>
                        </ion-list>
                    </ion-card-content>
                </ion-card>
            </div>
        </div>
    </ion-content>
