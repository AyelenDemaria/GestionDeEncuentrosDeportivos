<div class="ion-page" id="main-content">

    <ion-header [translucent]="true">
        <ion-toolbar color="light">
            <ion-buttons slot="end">
                <ion-menu-button></ion-menu-button>
            </ion-buttons>
            <ion-buttons slot="start" style="margin-left: 1rem;  font-size: x-large;" [routerLink]="['/home']">
                <ion-icon name="home-outline"></ion-icon>
            </ion-buttons>
            <ion-title style="font-family: 'Segoe UI'" >Mis partidos</ion-title>
        </ion-toolbar>
    </ion-header>
    <ion-content>    
        <ion-searchbar placeholder="Buscar partido" [(ngModel)]="filtro"></ion-searchbar>
        <div style="display: flex; justify-content: center;">
            <button class="reporte" [routerLink]="['/reporte']">Reporte de partidos</button>
        </div>
        <div class="content boton">
            <div *ngFor="let part of filteredPartidos">
                <ion-card>
                    <ion-card-header style="padding-bottom: 0;">
                        <div style="display: flex; justify-content: space-between;">
                            <ion-card-title>Partido de {{part.partido.cancha.deporte.descripcion}}</ion-card-title>
                            <ion-buttons *ngIf="partidoFechaPasada(part.partido.fecha_hora)" style="font-size: x-large;" (click)="invitar(part.partido.id)">
                                <ion-icon class="yes" name="person-add"></ion-icon>
                            </ion-buttons>

                            <ion-buttons *ngIf="partidoFechaPasada(part.partido.fecha_hora)" style="font-size: x-large;" (click)="mensajeBaja(part.id)">
                                <ion-icon class="no" name="person-remove"></ion-icon>
                            </ion-buttons>

                            <button *ngIf="!partidoFechaPasada(part.partido.fecha_hora)" style="font-size: small; width: min-content; font-family: system-ui;">
             Partido finalizado
              </button>
                        </div>
                        <!-- <ion-card-subtitle>{{8}} inscriptos</ion-card-subtitle> -->
                    </ion-card-header>
                    <ion-card-content>
                        <ion-list>
                            <ion-item>
                                <ion-text>Fecha y hora:</ion-text> {{part.partido.fecha_hora | date:'yyyy-MM-dd HH:mm'}}
                            </ion-item>
                            <ion-item>
                                <ion-text>Cantidad jugadores:</ion-text> {{part.partido.cant_jugadores}}
                            </ion-item>
                            <ion-item>
                                <ion-text>Cancha:</ion-text> {{part.partido.cancha.direccion}}
                            </ion-item>
                            <ion-item>
                                <ion-text>Tipo de partido:</ion-text> {{part.partido.tipo_partido.descripcion}}
                            </ion-item>
                        </ion-list>
                    </ion-card-content>
                </ion-card>
            </div>
        </div>
    </ion-content>
