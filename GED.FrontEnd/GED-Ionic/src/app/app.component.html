<ion-app>
    <ion-menu contentId="main-content">
        <ion-header>
            <ion-toolbar color="success">
                <ion-title style="font-weight: 500; font-size: large;">MENU</ion-title>
            </ion-toolbar>
        </ion-header>
        <ion-content>
            <ion-list>
                <ion-menu-toggle auto-hide="true">
                    <ion-item [routerLink]="['/profile']" routerLinkActive="class-active">
                        Mi perfil
                    </ion-item>
                    <ion-item [routerLink]="['/nuevoPartido']" routerLinkActive="class-active">
                        Nuevo Partido
                    </ion-item>
                    <ion-item [routerLink]="['/unirme']" routerLinkActive="class-active">
                        Unirme a un partido
                    </ion-item>
                    <ion-item [routerLink]="['/misPartidos']" routerLinkActive="class-active">
                        Mis partidos
                    </ion-item>
                    <ion-item [routerLink]="['/invitaciones']" routerLinkActive="class-active">
                        Invitaciones
                    </ion-item>
                    <ion-item [routerLink]="['/canjear']" routerLinkActive="class-active">
                        Canjear puntos
                    </ion-item>
                    <ion-item [routerLink]="['/misVoucher']" routerLinkActive="class-active">
                        Mis voucher
                    </ion-item>
                    <ion-item [routerLink]="['/reporte']" routerLinkActive="class-active">
                        Reporte de partidos
                    </ion-item>
                    <ion-item [routerLink]="['/suspendidos']" routerLinkActive="class-active">
                        Partidos suspendidos
                    </ion-item>
                    <ion-item (click)="cerrarSesion()">
                        Cerrar sesión
                    </ion-item>
                </ion-menu-toggle>
            </ion-list>
        </ion-content>
    </ion-menu>

    <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
